<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reg</title>
</head>
<body>
<form id="myForm" th:method="post" th:action="@{/auth/register}">
    <input type="text" name="username" id="username"><label for="username">Username</label>
    <input type="password" name="password" id="password"><label for="password">Password</label>
    <input type="submit" value="Reg">
</form>
<script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var formData = new FormData(this);
        var object = {};
        formData.forEach(function(value, key){
            object[key] = value;
        });
        var json = JSON.stringify(object);

        fetch('/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: json
        })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
    });
</script>
</body>
</html>
